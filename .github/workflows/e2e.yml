# End-to-end tests (Playwright) against the live site.
# After a push, waits until Vercel is serving that exact commit, then runs the browser tests.
# Also runs weekly and can be started by hand from the Actions tab.
name: E2E tests

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: e2e
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE: https://vehicle-store-nine.vercel.app
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Vercel to deploy this commit
        if: github.event_name == 'push'
        run: |
          for i in $(seq 1 40); do
            live=$(curl -s "$SITE/api/health" | jq -r '.commit // empty')
            if [ "$live" = "$GITHUB_SHA" ]; then echo "Live on $live"; exit 0; fi
            echo "Live commit: ${live:-unknown}; waiting for $GITHUB_SHA ($i/40)"
            sleep 15
          done
          echo "::error::Deployment of $GITHUB_SHA did not go live within 10 minutes"
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          E2E_BASE_URL: ${{ env.SITE }}

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
