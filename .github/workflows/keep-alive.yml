# Free Supabase projects pause after 7 days with no activity, which would break the live demo.
# This pings the site's health check every 3 days; it can also be run by hand from the Actions tab.
name: Keep database awake

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call the health check
        run: curl --fail --silent --show-error --max-time 30 https://vehicle-store-nine.vercel.app/api/health
